name: Deploy web

# Only runs after the CI workflow passes on main — never deploys broken code.
# Note: Database migrations are NOT applied here. They are applied only when
# pushing a version tag (v1.0.0), via the mobile.yml workflow, which ensures
# the migration is applied BEFORE the app build is released. This prevents
# older app versions from breaking if a migration is applied in advance.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  # ── Build Expo web and deploy to Vercel ──────────────────────────────────
  deploy:
    name: Build web → Vercel
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build Expo web
        run: npx expo export --platform web

      # The vercel CLI reads VERCEL_ORG_ID and VERCEL_PROJECT_ID from the
      # environment. --prod creates a production deployment (not a preview).
      # --yes skips interactive prompts.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel dist --prod --yes --token="$VERCEL_TOKEN"
