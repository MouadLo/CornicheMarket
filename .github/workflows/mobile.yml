name: Mobile delivery

on:
  # OTA update: triggers after CI passes on main.
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

  # Binary build + production DB migration: triggers when a version tag is pushed.
  # Only tag commits that are already on main (CI will have passed on the branch).
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # ── OTA update (over-the-air JS bundle update via EAS Update) ────────────
  # Runs on every successful merge to main. Updates the "preview" channel so
  # internal testers on preview builds receive the latest JS immediately.
  ota-update:
    name: EAS Update → preview channel
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CI: "1"
      EXPO_NO_DOTENV: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Publish OTA update
        run: |
          npx eas-cli@latest update \
            --branch preview \
            --message "OTA: ${{ github.event.workflow_run.head_commit.message }}" \
            --non-interactive

  # ── EAS Build (native binary via EAS cloud builders) ─────────────────────
  # Runs when a version tag like v1.2.3 is pushed. Produces store-ready builds.
  # Always builds from the same commit the tag points to.
  eas-build:
    name: EAS Build (Android + iOS)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CI: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate EAS configuration
        run: node scripts/check-eas-config.js
        env:
          BUILD_PLATFORM: all

      - name: Trigger EAS Build (non-blocking — monitor in Expo dashboard)
        run: |
          npx eas-cli@latest build \
            --profile production \
            --platform all \
            --non-interactive \
            --no-wait

  # ── DB migration ──────────────────────────────────────────────────────────
  # Runs on the same tag push as eas-build. Migrations apply to the single
  # Supabase project. This ensures migrations are applied BEFORE the app build
  # is released, preventing older app versions from breaking.
  migrate:
    name: Apply database migrations
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: eas-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
