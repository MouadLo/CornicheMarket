name: CI

on:
  push:
  pull_request:

# Cancel any in-flight run for the same branch/PR so fast-pushers don't queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check · lint · test · bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      EXPO_NO_DOTENV: "1"
      # Placeholder values so the Supabase client initialises without real credentials.
      # Tests mock the module; the bundle step just needs non-empty vars.
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      # Skip husky in CI (no interactive terminal, hooks not needed).
      # lint-staged is also not needed here; linting runs on the full tree below.
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Verify Expo SDK dependency versions
        run: npx expo install --check

      - name: Bundle (Android + iOS + web) — catches build-time errors
        run: npm run export:ci

  # A migration can be syntactically fine and still fail to apply: Postgres
  # refuses some statements that are legal SQL in isolation but illegal as a
  # change to an existing object (e.g. `create or replace view` inserting a
  # column instead of appending it, or `create or replace function`
  # changing a return type). Those only ever surface by actually applying
  # every migration, in order, to an empty database -- which is exactly
  # what this job does, the same way a fresh clone or a new environment
  # would. ubuntu-latest has Docker preinstalled, so the Supabase CLI can
  # run its full local stack here without any extra setup.
  migrations:
    name: Migrations apply cleanly to an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned: "latest" started rejecting `[inbucket]` in supabase/config.toml
      # (it wants `[local_smtp]`), so `supabase start` failed on every PR before
      # any SQL ran. 2.122.0 is what the repo is developed against. Move to the
      # new config and bump this together.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # The local stack listens on 54320-54329 (supabase/config.toml). Those
      # sit inside Linux's ephemeral port range, so an outgoing connection on
      # the runner (image pulls, etc.) sometimes grabs 54322 first and
      # `supabase start` fails with "address already in use". Reserving the
      # range keeps the kernel from handing those ports out.
      - name: Reserve the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - name: Apply every migration + seed.sql from scratch
        run: supabase start

      # Catches anything that only fails on a second run (e.g. a migration
      # missing "if not exists" or "create or replace").
      - name: Reset and reapply from scratch
        run: supabase db reset

      # Database rules that need the real schema and seed (no app, no network).
      # Each file is a transaction that raises on any broken rule and rolls back.
      - name: Database rule tests
        run: |
          for f in tests/stock/invoiceApproval.sql tests/stock/invoiceCapture.sql tests/stock/invoiceMatching.sql tests/stock/deleteInvoiceDraft.sql tests/products/categoryCode.sql tests/products/subCategories.sql tests/sales/dayClose.sql tests/sales/voidRequests.sql tests/sales/customerCreditHistory.sql tests/auth/staffDeactivation.sql tests/sales/cashierDiscountLimit.sql tests/sales/customerDebtLimit.sql tests/sellGrid/arrangeGrid.sql tests/products/bulkPriceUndo.sql tests/sales/saleReturns.sql tests/print/printStation.sql tests/loyalty/loyaltyPoints.sql tests/divers/diversOwnerNoLimit.sql tests/reports/diversReport.sql tests/competitors/competitorPrices.sql tests/competitors/competitorShops.sql; do
            echo "== $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f "$f"
          done
