name: CI

on:
  push:
  pull_request:

# Cancel any in-flight run for the same branch/PR so fast-pushers don't queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check · lint · test · bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      EXPO_NO_DOTENV: "1"
      # Placeholder values so the Supabase client initialises without real credentials.
      # Tests mock the module; the bundle step just needs non-empty vars.
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      # Skip husky in CI (no interactive terminal, hooks not needed).
      # lint-staged is also not needed here; linting runs on the full tree below.
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Verify Expo SDK dependency versions
        run: npx expo install --check

      - name: Bundle (Android + iOS + web) — catches build-time errors
        run: npm run export:ci

  # A migration can be syntactically fine and still fail to apply: Postgres
  # refuses some statements that are legal SQL in isolation but illegal as a
  # change to an existing object (e.g. `create or replace view` inserting a
  # column instead of appending it, or `create or replace function`
  # changing a return type). Those only ever surface by actually applying
  # every migration, in order, to an empty database -- which is exactly
  # what this job does, the same way a fresh clone or a new environment
  # would. ubuntu-latest has Docker preinstalled, so the Supabase CLI can
  # run its full local stack here without any extra setup.
  migrations:
    name: Migrations apply cleanly to an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply every migration + seed.sql from scratch
        run: supabase start

      # Catches anything that only fails on a second run (e.g. a migration
      # missing "if not exists" or "create or replace").
      - name: Reset and reapply from scratch
        run: supabase db reset
