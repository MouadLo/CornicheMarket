name: CI and mobile delivery

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options:
          - preview
          - production
        default: preview
      platform:
        description: Target platform
        type: choice
        options:
          - android
          - ios
          - all
        default: android

permissions:
  contents: read

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      # Bundle checks must work on forks without credentials or a live backend.
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Check SDK dependency versions
        run: npx expo install --check
      - name: Bundle Android, iOS, and web
        run: npm run export:ci

  build:
    name: EAS build
    needs: validate
    # Preview delivery on the default branch is opt-in after EAS onboarding.
    # Production builds are started manually from the default branch only.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.ENABLE_EAS_BUILDS == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.profile || 'preview' }}
    concurrency:
      group: eas-${{ inputs.profile || 'preview' }}
      cancel-in-progress: false
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_PROFILE: ${{ inputs.profile || 'preview' }}
      BUILD_PLATFORM: ${{ inputs.platform || 'android' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add EXPO_TOKEN as a GitHub Actions secret. See docs/ci-cd.md.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check EAS project configuration
        run: node scripts/check-eas-config.js
      - name: Install locked dependencies
        run: npm ci
      - name: Build and wait for completion
        run: npx eas-cli@latest build --profile "$BUILD_PROFILE" --platform "$BUILD_PLATFORM" --non-interactive --wait
